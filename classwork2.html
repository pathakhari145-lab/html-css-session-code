<!DOCTYPE html>
<html lang="en">
<head>
    <title>registration form</title>
     <style>
    table, th, td {
      border: solid rgb(0, 128, 68);
      background-color: beige;
      
    }

    table {
      color: blue; 
    }
    th {
        text-align: left;
    }
  </style>
</head>
<body bgcolor="peachpuff">
    <table border="2" cellpadding="5">
        <form>
            <tr>
                <th colspan="3">Registration Form</th>
            </tr>
            <tr>
                <th>
                Full Name
                </th>
                <td colspan="2">
                <input type="text">
                </td>
            </tr>
                   <tr>
                <th>
                Username
                </th>
                <td colspan="2">
                <input type="text">
                </td>
            </tr>
                   <tr>
                <th>
                Password
                </th>
                <td colspan="2">
                <input type="text">
                </td>
            </tr>
                   <tr>
                <th>
                Date of birth
                </th>
                <td colspan="2">
                <input type="date">
                </td>
            </tr>
             <tr>
            <td><b>Qualification</b></td>
            <td colspan="2">
                <ol type="1">
                    <li><i>A - Secondary</i></li>
                    <li><i>B - Higher Secondary</i></li>
                    <li><i>C - Bachelor</i></li>
                    <li><i>A - Master</i></li>
                    <li><i>B - Other</i></li>
                </ol>
            </td>
        </tr>
         <tr>
            <td rowspan="2"><b>Personal Details</b></td>
            <th>Subscript</th>
            <th>Superscript</th>
        </tr>
         <tr>
            <td>H<sub>2</sub>O</td>
            <td>X<sup>2</sup></td>
        </tr>
         <tr>
            <th>Text Formatting</th>
            <td colspan="2">
                <b>Bold Text</b><br>
                <i>Italic Text</i>
                <tr>
            <th>Website</th>
            <td colspan="2"><a href="https://www.google.com" target="_blank">Visit Google</a></td>
        </tr>
        <tr>
            <td colspan="3" align="center">
            <button type="submit">Register</button>
             <button type="reset">Reset</button>

            </td>
        </tr>
        </form>
    </table>
</body>
</html>
