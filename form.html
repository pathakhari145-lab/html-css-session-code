<!DOCTYPE html>
<html lang="en">
<head>

    <title>form tag</title>
</head>
<body>
    <h1>FORM TAG</h1>
    <form action="submit">
        <label for="name">NAME</label>
        <input type="text" placeholder="Enter your name"><br><br>

        <label for="email">Email</label>
        <input type="email"  placeholder="email"><br><br>

        <label for="phone">Phone</label>
        <input type="tel" placeholder="phone"><br><br>

        <label for="pass">Password</label>
        <input type="password" placeholder="Password"><br><br>
         
        <label>Date of birth</label>
        <input type="datetime-local"><br><br>

        <label for="gender">Gender</label><br>

        <input type="radio" value="male" name="gender">male<br>

        <input type="radio" value="female" name="gender">female<br>

        <input type="radio" value="others" name="gender">others<br><br>

        <label>Hobbies</label><br>

        <input type="checkbox" value="football">football<br>
    
        <input type="checkbox" value="cricket">cricket<br>

        <input type="checkbox" value="chess">chess<br>

        <input type="checkbox" value="dancing">dacning<br><br>

        <label>select course</label><br>
        <select name="course">
            <option value="0" disabled selected>....</option>
            <option value="csit">csit</option>
            <option value="bca">BCA</option>
            <option value="bit">BIT</option>
        </select><br><br>

        <label>Message:</label><br>
        <textarea placeholder="Give us some suggestions" rows="20" cols="70"></textarea><br><br>

        <button type="submit">Submit</button>
        <button type="submit">login</button>
    </form>
</body>
</html>
<!-- checkbox and radio botton -->
