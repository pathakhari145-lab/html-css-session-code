<!DOCTYPE html>
<html>
<head>
    <title>Student Information Table</title>
    <style>
    table, th, td {
      border: solid rgb(0, 128, 68);
      background-color: beige;
    }

    table {
      color: blue; 
    }
  </style>
</head>
<body bgcolor="peachpuff">
    <h1>Student Information</h1>

    <table border="1">
        <caption><b>Student Details and Subject Marks</b></caption>
        <tr>
            <th rowspan="2">ID</th>
            <th rowspan="2">Name</th>
            <th colspan="3">Subjects</th>
            <th rowspan="2">Total</th>
        </tr>

        <tr>
            <th>HTML</th>
            <th>CSS</th>
            <th>JavaScript</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Shubham Bashyal</td>
            <td>85</td>
            <td>80</td>
            <td>90</td>
            <td>255</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Hari Bhai</td>
            <td>90</td>
            <td>85</td>
            <td>88</td>
            <td>263</td>
        </tr>

        <tr>
            <td rowspan="2">3</td>
            <td rowspan="2">sugam</td>
            <td>75</td>
            <td>80</td>
            <td>85</td>
            <td>240</td>
        </tr>

        <tr>
            <td colspan="3">Additional Project: Web Development</td>
            <td>50</td>
        </tr>
        <tfoot>
        <tr>
            <th colspan="5" align="center">Total Students</th>
            <td>3</td>
        </tr>
        </tfoot>
    </table>

</body>
</html>
